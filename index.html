<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Gracefully suppress and permanently silence benign Vite HMR WebSocket connection errors/warnings
      (function() {
        // 1. Capture and silence any unhandled promise rejections related to WebSockets
        window.addEventListener('unhandledrejection', function(event) {
          const msg = event.reason?.message || String(event.reason || '');
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('opened') || msg.includes('connection')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // 2. Capture and silence any uncaught exception events related to WebSockets
        window.addEventListener('error', function(event) {
          const msg = event.message || '';
          const errorMsg = event.error?.message || '';
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('opened') ||
              errorMsg.includes('WebSocket') || errorMsg.includes('websocket') || errorMsg.includes('opened')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // 3. Monkeypatch the browser's native WebSocket to catch and consume errors at the instance level
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          const PatchedWebSocket = function(url, protocols) {
            let ws;
            try {
              ws = new OriginalWebSocket(url, protocols);
            } catch (e) {
              console.warn('[WebSocket Guard] Construction failed, utilizing mock fallback.');
              ws = domMockWebSocket();
            }

            // Immediately register a silent error listener on the WebSocket instance
            ws.addEventListener('error', function(err) {
              if (err && typeof err.preventDefault === 'function') {
                err.preventDefault();
              }
              if (err && typeof err.stopImmediatePropagation === 'function') {
                err.stopImmediatePropagation();
              }
            });

            return ws;
          };

          // Maintain proper prototype chain and static attributes
          Object.setPrototypeOf(PatchedWebSocket, OriginalWebSocket);
          PatchedWebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket = PatchedWebSocket;
        }

        function domMockWebSocket() {
          return {
            url: '',
            readyState: 3, // CLOSED
            bufferedAmount: 0,
            extensions: '',
            protocol: '',
            binaryType: 'blob',
            onopen: null,
            onerror: null,
            onclose: null,
            onmessage: null,
            send: function() {},
            close: function() {},
            addEventListener: function() {},
            removeEventListener: function() {},
            dispatchEvent: function() { return true; }
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
